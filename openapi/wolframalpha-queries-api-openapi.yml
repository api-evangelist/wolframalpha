components:
  schemas:
    FullResultsResponse:
      type: object
      title: FullResultsResponse
      description: JSON wrapper for Wolfram|Alpha Full Results API response.
      properties:
        queryresult:
          type: object
          description: Top-level query result container.
          properties:
            success:
              type: boolean
              description: Whether the query was successfully interpreted.
              example: true
            error:
              type: boolean
              description: Whether an error occurred during processing.
              example: false
            numpods:
              type: integer
              description: Number of result pods returned.
              example: 2
            datatypes:
              type: string
              description: Categories of data types included in the results.
              example: Math
            timing:
              type: number
              description: Processing time in seconds.
              example: 0.812
            pods:
              type: array
              description: Array of result pods containing computed data.
              items:
                $ref: '#/components/schemas/Pod'
          example:
            success: true
            error: false
            numpods: 2
            datatypes: Math
            timing: 0.812
            pods:
            - string-value
    Pod:
      type: object
      title: Pod
      description: A single result section (pod) from Wolfram|Alpha.
      properties:
        title:
          type: string
          description: Human-readable title for this pod.
          example: Result
        scanner:
          type: string
          description: Internal scanner that generated this pod.
          example: Integral
        id:
          type: string
          description: Pod identifier for filtering.
          example: Result
        position:
          type: integer
          description: Ordering position in the result set.
          example: 200
        primary:
          type: boolean
          description: Whether this is the primary result pod.
          example: true
        subpods:
          type: array
          description: Sub-results within this pod.
          items:
            $ref: '#/components/schemas/Subpod'
          example:
          - string-value
    Subpod:
      type: object
      title: Subpod
      description: A sub-result within a Wolfram|Alpha pod.
      properties:
        plaintext:
          type: string
          description: Plain text representation of the result.
          example: 1/3
        img:
          type: object
          description: Image representation of the result.
          properties:
            src:
              type: string
              format: uri
              description: URL of the result image.
            alt:
              type: string
              description: Alt text for the result image.
            width:
              type: integer
            height:
              type: integer
          example:
            src: https://example.com/path
            alt: string-value
            width: 1
            height: 1
    LlmApiResponse:
      type: object
      title: LlmApiResponse
      description: Response from the Wolfram|Alpha LLM API containing computed results.
      properties:
        query:
          type: string
          description: The original query that was submitted.
          example: What is the boiling point of water?
        inputInterpretation:
          type: string
          description: Wolfram|Alpha's interpretation of the input query.
          example: boiling point | water
        result:
          type: string
          description: The primary computed result for the query.
          example: 100 degrees Celsius (at standard atmospheric pressure)
        images:
          type: array
          items:
            type: string
            format: uri
          description: List of image URLs related to the query results.
          example:
          - https://example.com/path
        link:
          type: string
          format: uri
          description: URL to the full Wolfram|Alpha results page for this query.
          example: https://www.wolframalpha.com/input?i=boiling+point+water
  securitySchemes:
    AppID:
      type: apiKey
      in: query
      name: appid
      description: Wolfram|Alpha AppID passed as query parameter.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AppID
      description: Pass AppID as Bearer token in Authorization header.
